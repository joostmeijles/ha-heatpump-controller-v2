set_target_temperature:
  name: Set Target Temperature
  description: >
    Manually set the controller's target temperature. This updates all room
    setpoints to target + setpoint_delta and re-evaluates heatpump control.
  fields:
    temperature:
      name: Temperature
      description: The new target temperature in °C.
      required: true
      selector:
        number:
          min: 5
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
